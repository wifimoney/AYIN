# AYIN Phase 1 Development Services
# Provides PostgreSQL and Redis for local development

services:
  postgres:
    image: postgres:15-alpine
    container_name: ayin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayin
      POSTGRES_PASSWORD: ayin_dev_password
      POSTGRES_DB: ayin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ayin -d ayin" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
